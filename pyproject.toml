[project]
name = "worksmobile-mcp"
version = "0.1.0"
description = "Unofficial NAVER WORKS (LINE WORKS) Drive admin CLI + MCP server — service-account delegation, shared-drive permission management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Namun Cho" }]
keywords = ["naver-works", "line-works", "worksmobile", "mcp", "model-context-protocol", "drive", "admin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "pyjwt[crypto]>=2.8",
    "mcp>=2.0",
]

[project.urls]
Repository = "https://github.com/z0nam/worksmobile-mcp"

[project.scripts]
worksmobile = "worksmobile_mcp.cli:main"
worksmobile-mcp = "worksmobile_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worksmobile_mcp"]
